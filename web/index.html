<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caixa Comum</title>
<meta name="theme-color" content="#0E6E68">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — sidebar de navegação no desktop, barra inferior no celular; conteúdo em coluna única de até 1080px */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#E7EDEB; --line:#D3DDDA;
  --fg:#13201D; --muted:#5A6A66; --accent:#0E6E68; --accent-ink:#FFFFFF; --accent-soft:#D5ECE8;
  --pos:#1B8A4C; --neg:#C23B2A; --warn:#A86A12; --pos-soft:#DCF1E4; --neg-soft:#F7E0DB; --warn-soft:#F5EAD3;
  --shadow:0 1px 2px rgba(19,32,29,.06),0 8px 24px rgba(19,32,29,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1614; --surface:#15201D; --surface-2:#1D2A27; --line:#2A3A36;
  --fg:#E5EDEB; --muted:#93A59F; --accent:#4DBFB3; --accent-ink:#05201C; --accent-soft:#163935;
  --pos:#4CC27F; --neg:#F07A68; --warn:#E2B04F; --pos-soft:#14301E; --neg-soft:#3A1D19; --warn-soft:#382D16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#15201D; --surface-2:#1D2A27; --line:#2A3A36;
  --fg:#E5EDEB; --muted:#93A59F; --accent:#4DBFB3; --accent-ink:#05201C; --accent-soft:#163935;
  --pos:#4CC27F; --neg:#F07A68; --warn:#E2B04F; --pos-soft:#14301E; --neg-soft:#3A1D19; --warn-soft:#382D16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.1rem} h3{font-size:.95rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px}
.brand b{font-family:var(--f-display);font-size:1.15rem}
.nav-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;color:var(--muted);font-weight:500}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn:hover{background:var(--surface-2);color:var(--fg)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
.nav-btn .badge{margin-left:auto}
.side-foot{margin-top:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.avatars{display:flex}
.avatars img{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);margin-left:-6px}
.avatars img:first-child{margin-left:0}

.main{min-width:0;padding-block:20px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{margin-right:auto}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.monthnav button{border:0;background:none;width:30px;height:30px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.monthnav button:hover{background:var(--surface-2);color:var(--fg)}
.monthnav span{min-width:130px;text-align:center;font-weight:600;text-transform:capitalize}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--neg);border-color:var(--neg-soft);background:var(--neg-soft)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.panel-h h2{margin-right:auto}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}

.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .v{font-family:var(--f-num);font-size:1.45rem;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .s{font-size:.8rem;color:var(--muted)}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hero .label,.kpi.hero .s{color:inherit;opacity:.8}

.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--pos-soft);color:var(--pos)}
.chip.bad{background:var(--neg-soft);color:var(--neg)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--fg)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--neg);color:#fff;font-size:.72rem;font-weight:700;display:inline-grid;place-items:center}

.dot{width:10px;height:10px;border-radius:50%;flex:none}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row.click{cursor:pointer;border-radius:6px}
.row.click:hover{background:var(--surface-2)}
.row .main-t{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.row img.av{width:20px;height:20px;border-radius:50%}
.day-h{display:flex;justify-content:space-between;padding:14px 4px 4px;font-size:.78rem;color:var(--muted);font-weight:600;text-transform:capitalize}
.check{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;flex:none;color:transparent}
.check.on{background:var(--pos);border-color:var(--pos);color:#fff}
.check svg{width:14px;height:14px}

.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar i.over{background:var(--neg)} .bar i.near{background:var(--warn)}

.empty{padding:22px 8px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--fg);font-family:var(--f-display);font-size:1rem}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--fg);font-size:.88rem;border:1px solid var(--line)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seg.kind button[aria-pressed="true"][data-v="despesa"]{color:var(--neg)}
.seg.kind button[aria-pressed="true"][data-v="receita"]{color:var(--pos)}

input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);min-width:0}
textarea{resize:vertical;min-height:110px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.8rem;font-weight:600;color:var(--muted)}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.money-in{font-family:var(--f-num);font-size:1.6rem !important;font-weight:500;padding:10px 12px !important}
.tot{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end;padding-top:12px;border-top:1px solid var(--line);font-size:.88rem}
.tot b{font-family:var(--f-num);font-weight:500}

dialog{border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--fg);width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(8,16,14,.45)}
.dlg-h{display:flex;align-items:center;gap:8px;padding:16px 18px 8px}
.dlg-h h2{margin-right:auto}
.dlg-b{padding:8px 18px 18px;display:flex;flex-direction:column;gap:12px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:4px}
.dlg-f .left{margin-right:auto}

.ccard{border-radius:12px;padding:14px;color:#fff;display:flex;flex-direction:column;gap:12px;min-height:140px;cursor:pointer;border:2px solid transparent;position:relative;overflow:hidden}
.ccard[aria-pressed="true"]{border-color:var(--fg)}
.ccard .cn{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.ccard .cf{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:.8rem;gap:8px}
.ccard .cf .num{font-size:1rem}
.ccard::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.1)}
.ccard .bar{background:rgba(255,255,255,.25)} .ccard .bar i{background:#fff}

.acc-tile{display:flex;flex-direction:column;gap:8px;cursor:pointer}
.acc-tile .bk{display:flex;align-items:center;gap:8px}
.mono-badge{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.75rem;flex:none}

.inbox-item{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.inbox-item .raw{font-size:.8rem;color:var(--muted);background:var(--surface-2);padding:8px 10px;border-radius:6px;word-break:break-word}
.inbox-grid{display:grid;grid-template-columns:110px minmax(0,2fr) 120px 140px;gap:8px}
.inbox-grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}

.chart text{fill:var(--muted);font-family:var(--f-num);font-size:11px}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .b-pos{fill:var(--pos)} .chart .b-neg{fill:var(--neg)}
.legend{display:flex;flex-direction:column;gap:8px;min-width:0}
.legend .li{display:flex;align-items:center;gap:8px;font-size:.88rem;min-width:0}
.legend .li span:nth-child(2){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.donut-wrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:8px 6px;text-align:left;border-top:1px solid var(--line)}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0}
td.r,th.r{text-align:right}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:50;max-width:calc(100vw - 32px)}
.fab{display:none}
.bottom{display:none}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.swatches button[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--surface) inset}
.sheet-list{display:flex;flex-direction:column;gap:4px}
.help{font-size:.85rem;color:var(--muted);line-height:1.55}
.help ol{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.loading-note{font-size:.85rem;color:var(--muted)}

@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}
  .bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;color:var(--muted);padding:4px 6px;cursor:pointer;position:relative;font-weight:600}
  .bottom button svg{width:22px;height:22px}
  .bottom button[aria-current="page"]{color:var(--accent)}
  .bottom .badge{position:absolute;top:0;right:2px;transform:scale(.85)}
  .fab{display:grid;place-items:center;position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);z-index:21;cursor:pointer}
  .fab svg{width:26px;height:26px}
  .hide-m{display:none !important}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .span2{grid-column:auto}
  .inbox-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .inbox-grid2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:1.15rem}
  .donut-wrap{grid-template-columns:minmax(0,1fr);justify-items:center}
  .donut-wrap .legend{width:100%}
  .frow{grid-template-columns:minmax(0,1fr)}
  .monthnav span{min-width:110px}
}
@media (prefers-reduced-motion:no-preference){.btn,.nav-btn,.check{transition:background .15s,border-color .15s,color .15s}}
body.gated .side,body.gated .bottom,body.gated .fab{display:none!important}
body.gated .app{grid-template-columns:minmax(0,1fr)}
.gate-card{max-width:440px;width:100%;margin:40px auto 0}
.code-box{font-family:var(--f-num);font-size:1.6rem;letter-spacing:.2em;padding:8px 14px;border-radius:8px;background:var(--surface-2);display:inline-block}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Navegação">
    <div class="brand"><div class="brand-mark">C</div><b>Caixa Comum</b></div>
    <nav id="sidenav" class="list" style="gap:2px"></nav>
    <div class="side-foot">
      <div class="label">Quem usa</div>
      <div class="avatars" id="people-mini"></div>
    </div>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<nav class="bottom" id="bottomnav" aria-label="Navegação"></nav>
<button class="fab" id="fab" data-act="new-tx" aria-label="Novo lançamento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
/*PARSER-START*/
const BANKS = {bb:"Banco do Brasil",nubank:"Nubank",inter:"Inter",c6:"C6 Bank",picpay:"PicPay",caixa:"Caixa",itau:"Itaú",bradesco:"Bradesco",santander:"Santander",outro:"Outro / dinheiro"};
const pad = n => String(n).padStart(2,"0");
function todayStr(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseMoney(s){
  if(typeof s==="number") return s;
  s=String(s||"").replace(/[^\d,.\-]/g,"");
  if(!s) return NaN;
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  const v=parseFloat(s); return isNaN(v)?NaN:Math.round(v*100)/100;
}
function detectBank(s){
  const t=s.toLowerCase();
  if(/picpay/.test(t)) return "picpay";
  if(/nubank|\bnu\b|nuconta/.test(t)) return "nubank";
  if(/\bc6\b|c6 ?bank/.test(t)) return "c6";
  if(/banco inter|\binter\b/.test(t)) return "inter";
  if(/banco do brasil|\bbb\b|ourocard/.test(t)) return "bb";
  return null;
}
function splitNotifs(text){
  let blocks=text.split(/\n\s*\n/);
  if(blocks.length===1) blocks=text.split(/\n/);
  const out=[]; let prefix="";
  for(let b of blocks){
    b=b.replace(/\s+/g," ").trim(); if(!b) continue;
    if(/R\$\s?\d/.test(b)){ out.push((prefix?prefix+" ":"")+b); prefix=""; }
    else prefix=(prefix?prefix+" ":"")+b;
  }
  return out;
}
function titleCase(s){
  if(s!==s.toUpperCase()) return s;
  return s.toLowerCase().replace(/(^|[\s/-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
}
function cleanName(s){
  if(!s) return null;
  s=s.replace(/\s+(foi|está|esta|com sucesso|aprovad[oa]).*$/i,"").replace(/^(o|a|os|as)\s+/i,"").trim();
  if(!s||/^\d/.test(s)||/^r\$/i.test(s)||/^(sua|seu|conta|cart[aã]o)\b/i.test(s)) return null;
  return titleCase(s).slice(0,60);
}
function parseNotif(raw, fallbackBank){
  const m=raw.match(/R\$\s?(\d{1,3}(?:\.\d{3})*,\d{2}|\d+(?:[.,]\d{2})?)/i);
  if(!m) return null;
  const amount=parseMoney(m[1]);
  const low=raw.toLowerCase();
  const sent=/(enviad[oa]|voc[eê] (pagou|fez|enviou|transferiu)|pagamento (de|realizado|efetuado)|compra|d[eé]bito|saque)/.test(low);
  const income=!sent && /(recebeu|recebid[oa]|caiu|dep[oó]sito|creditad[oa]|entrada|estorno|reembolso|rendimento|cashback)/.test(low);
  const isCard=!income && /(compra|cart[aã]o|cr[eé]dito aprovad|final\s*\d{4})/.test(low);
  const credit=isCard && !/d[eé]bito/.test(low);
  const final=(raw.match(/final\s*(\d{4})/i)||[])[1]||null;
  let desc=null, mm;
  if(!income){
    mm=raw.match(/\b(?:em|no estabelecimento|estabelecimento:?|local:?)\s+([^,.;:!]+?)(?=\s+(?:para o|no cart|com o cart|cart[aã]o|final|às|as \d|dia \d|valor)\b|[,.;!]|\s-\s|$)/i);
    if(mm) desc=cleanName(mm[1]);
    if(!desc){ mm=raw.match(/\b(?:para|pra)\s+(?!o cart|seu cart|a conta)([^,.;!]+?)(?=\s+(?:no valor|via|às)\b|\s+em \d|[,.;!]|\s-\s|$)/i); if(mm) desc=cleanName(mm[1]); }
    if(!desc && isCard){ mm=raw.match(/R\$\s?[\d.]+,\d{2}\s*[,-]\s*([^,;]+?)\s*(?:,|;|$)/); if(mm) desc=cleanName(mm[1]); }
  } else {
    mm=raw.match(/\bde\s+(?!R\$)([A-ZÀ-Ú][^,.;!]*?)(?=\s+(?:no valor|via|às|na sua|em sua)\b|\s+em \d|[,.;!]|\s-\s|$)/);
    if(mm) desc=cleanName(mm[1]);
  }
  const pix=/\bpix\b/i.test(raw);
  if(!desc) desc= income ? (pix?"Pix recebido":"Recebimento") : isCard ? "Compra no cartão" : (pix?"Pix enviado":"Pagamento");
  else if(pix && !isCard) desc=(income?"Pix de ":"Pix para ")+desc;
  let date=todayStr();
  const dm=raw.match(/\b(\d{2})\/(\d{2})(?:\/(\d{2,4}))?\b/);
  if(dm){
    const t=todayStr(); let y=dm[3]?(dm[3].length===2?"20"+dm[3]:dm[3]):t.slice(0,4);
    let cand=y+"-"+dm[2]+"-"+dm[1];
    if(!dm[3] && cand>t) cand=(+y-1)+"-"+dm[2]+"-"+dm[1];
    if(+dm[2]>=1 && +dm[2]<=12 && +dm[1]>=1 && +dm[1]<=31) date=cand;
  }
  return {raw, bank:detectBank(raw)||fallbackBank||null, kind:income?"receita":"despesa", amount, desc, date, card:credit, final};
}
/*PARSER-END*/

function invoiceFor(card,date){const [y,m,d]=date.split("-").map(Number);const ym=y+"-"+pad(m);const close=d>=card.closingDay?addYM(ym,1):ym;return card.closingDay<card.dueDay?close:addYM(close,1);}
function dueDateOf(card,inv){const [y,m]=inv.split("-").map(Number);return inv+"-"+pad(Math.min(card.dueDay,dim(y,m)));}
function closeDateOf(card,inv){const cm=card.closingDay<card.dueDay?inv:addYM(inv,-1);const [y,m]=cm.split("-").map(Number);return cm+"-"+pad(Math.min(card.closingDay,dim(y,m)));}
function invoiceInfo(card,inv){
  const items=S.tx.filter(t=>t.kind==="despesa"&&t.cardId===card.id&&t.invoice===inv).sort((a,b)=>a.date<b.date?-1:1);
  const total=sum(items);
  const paid=sum(S.tx.filter(t=>t.kind==="pagfatura"&&t.cardId===card.id&&t.invoice===inv));
  const due=dueDateOf(card,inv), close=closeDateOf(card,inv), today=todayStr();
  let status, cls;
  if(total<=0){status="Sem gastos";cls="";}
  else if(paid>=total-0.005){status="Paga";cls="ok";}
  else if(today>due){status="Vencida";cls="bad";}
  else if(today>=close){status="Fechada";cls="warn";}
  else {status="Aberta";cls="acc";}
  return {items,total,paid,remaining:Math.max(0,total-paid),due,close,status,cls};
}

    else if(t.kind==="despesa"&&!t.cardId&&t.accountId===id) b-=t.amount;
    else if(t.kind==="transf"){ if(t.accountId===id) b-=t.amount; if(t.toAccountId===id) b+=t.amount; }
    else if(t.kind==="pagfatura"&&t.accountId===id) b-=t.amount;
  }
  return b;
}

      if(error) throw error;

function subscribe(){
  if(channel) sb.removeChannel(channel);
  const cid=S.caixa.id;
  const onRow=p=>{
    if(p.eventType==="DELETE"){const o=p.old||{}; if(o.caixa_id&&o.caixa_id!==cid) return; if(cache[o.col]) delete cache[o.col][o.id];}
    else {const n=p.new; if(!n||n.caixa_id!==cid||!cache[n.col]) return; cache[n.col][n.id]=n.data;}
    derive();
  };
  channel=sb.channel("docs-"+cid)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"docs",filter:"caixa_id=eq."+cid},onRow)
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"docs",filter:"caixa_id=eq."+cid},onRow)
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"docs"},onRow)
    .subscribe();
}

    lsSet("cc_cfg",JSON.stringify({url,key})); location.reload(); return;
  }
  if(f.id==="login-form"){
    const email=val("lg-email").trim(), senha=val("lg-senha");
    if(S.loginMode==="up"){
      const nome=val("lg-nome").trim();
      const {data,error}=await sb.auth.signUp({email,password:senha,options:{data:{nome}}});
      if(error) return toast(traduz(error.message));
      if(!data.session) return toast("Conta criada. Abra o e-mail de confirmação e depois entre.");
      return afterLogin(data.session);
    }
    const {data,error}=await sb.auth.signInWithPassword({email,password:senha});
    if(error) return toast(traduz(error.message));
    return afterLogin(data.session);
  }
  if(f.id==="join-form"){
    const cod=val("jn-cod").trim(); if(cod.length<6) return toast("O código tem 6 caracteres.");
    const {data,error}=await sb.rpc("entrar_caixa",{p_codigo:cod,p_meu_nome:S.myName});
    if(error) return toast(error.message);
    return openCaixa(data);
  }
  if(f.id==="new-caixa-form"){
    const {data,error}=await sb.rpc("criar_caixa",{p_nome:val("nc-nome").trim()||"Nosso caixa",p_meu_nome:S.myName});
    if(error) return toast(error.message);
    return openCaixa(data);
  }
}
function traduz(m){
  if(/Invalid login/i.test(m)) return "E-mail ou senha incorretos.";
  if(/already registered/i.test(m)) return "Este e-mail já tem conta. Use Entrar.";
  if(/Password should be/i.test(m)) return "A senha precisa ter pelo menos 6 caracteres.";
  if(/Email not confirmed/i.test(m)) return "Confirme seu e-mail antes de entrar.";
  return m;
}

/* ---------- componentes ---------- */
function avatarOf(id){const p=id&&S.profiles[id];return p?`<img class="av" src="${esc(p.avatarUrl)}" alt="" title="Lançado por ${esc(p.name||"alguém")}">`:"";}
function txRow(t,{showDate=false}={}){
  const c=catOf(t.categoryId);
  let color=c?.color||"var(--muted)", sub="", cls="", sign="";
  if(t.kind==="receita"){cls="pos";sign="+ ";sub=(c?.name||"Sem categoria")+" · "+accName(t.accountId);}
  else if(t.kind==="despesa"){cls="neg";sign="− ";sub=(c?.name||"Sem categoria")+" · "+(t.cardId?cardName(t.cardId):accName(t.accountId));}
  else if(t.kind==="transf"){color="var(--muted)";sub="Transferência · "+accName(t.accountId)+" → "+accName(t.toAccountId);}
  else if(t.kind==="pagfatura"){color="var(--muted)";sub="Pagamento de fatura · "+accName(t.accountId);}
  if(showDate) sub=dmy(t.date)+" · "+sub;
  const showCheck=!t.cardId&&t.kind!=="pagfatura";
  return `<div class="row click" data-act="edit-tx" data-id="${t.id}">
    <span class="dot" style="background:${esc(color)}"></span>
    <div class="main-t"><div class="t">${esc(txTitle(t))}${t.source==="notificacao"?' <span class="chip">notificação</span>':""}</div><div class="sub">${esc(sub)}</div></div>
    ${avatarOf(t.createdBy)}
    <div class="amt ${cls}">${sign}${fmt(t.amount)}</div>
    ${showCheck?`<button class="check ${t.paid?"on":""}" data-act="toggle-paid" data-id="${t.id}" aria-label="${t.paid?"Marcar como pendente":"Marcar como pago"}" title="${t.paid?(t.kind==="receita"?"Recebido":"Pago"):"Pendente"}">${ICON_CHECK}</button>`:`<span style="width:26px"></span>`}
  </div>`;
}
function emptyBox(title,text,btn=""){return `<div class="empty"><b>${title}</b><span>${text}</span>${btn}</div>`;}
function donut(data,size=150){
  const tot=sum(data,d=>d.v); if(tot<=0) return "";
  const R=56,C=2*Math.PI*R; let off=0;
  const segs=data.map(d=>{const len=d.v/tot*C;const s=`<circle r="${R}" cx="75" cy="75" fill="none" stroke="${esc(d.cat?.color||"#8a9a96")}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`;off+=len;return s;}).join("");
  return `<svg viewBox="0 0 150 150" width="${size}" height="${size}" role="img" aria-label="Despesas por categoria"><circle r="${R}" cx="75" cy="75" fill="none" stroke="var(--surface-2)" stroke-width="20"/>${segs}<text x="75" y="70" text-anchor="middle" style="fill:var(--muted);font:600 9px var(--f-body);letter-spacing:.06em">TOTAL</text><text x="75" y="88" text-anchor="middle" style="fill:var(--fg);font:500 13px var(--f-num)">${esc(compact(tot))}</text></svg>`;
}
function catLegend(data,limit=6){
  const tot=sum(data,d=>d.v);
  const top=data.slice(0,limit); const rest=data.slice(limit);
  if(rest.length) top.push({id:"_r",v:sum(rest,d=>d.v),cat:{name:"Outras",color:"#8a9a96"}});
  return `<div class="legend">${top.map(d=>`<div class="li"><span class="dot" style="background:${esc(d.cat?.color||"#8a9a96")}"></span><span>${esc(d.cat?.name||"Sem categoria")}</span><span class="num">${fmt(d.v)}</span><span class="muted num" style="width:38px;text-align:right">${Math.round(d.v/tot*100)}%</span></div>`).join("")}</div>`;
}

/* ---------- Lançamentos ---------- */
function vLanc(){
  const f=S.filter; const q=f.q.trim().toLowerCase();
  let list=S.tx.filter(t=>t.date&&t.date.slice(0,7)===S.month);
  if(f.kind!=="todos") list=list.filter(t=>f.kind==="transf"?(t.kind==="transf"||t.kind==="pagfatura"):t.kind===f.kind);
  if(f.src) list=list.filter(t=>f.src.startsWith("c:")?t.cardId===f.src.slice(2):(t.accountId===f.src.slice(2)||t.toAccountId===f.src.slice(2))&&!t.cardId);
  if(q) list=list.filter(t=>(t.desc||"").toLowerCase().includes(q)||(catOf(t.categoryId)?.name||"").toLowerCase().includes(q));
  list.sort((a,b)=>a.date===b.date?(b.createdAt||"").localeCompare(a.createdAt||""):a.date<b.date?1:-1);
  const groups={}; list.forEach(t=>(groups[t.date]=groups[t.date]||[]).push(t));
  const r=sum(list.filter(t=>t.kind==="receita")), d=sum(list.filter(t=>t.kind==="despesa"));
  const srcOpts=`<option value="">Todas as contas e cartões</option>`+S.accounts.map(a=>`<option value="a:${a.id}" ${f.src==="a:"+a.id?"selected":""}>${esc(a.name)}</option>`).join("")+S.cards.map(c=>`<option value="c:${c.id}" ${f.src==="c:"+c.id?"selected":""}>Cartão ${esc(c.name)}</option>`).join("");

/* ---------- Relatórios ---------- */
function barChart(months){
  const W=640,H=230,L=58,B=26,T=12; const iw=W-L-12, ih=H-B-T;
  const mx=niceMax(Math.max(...months.map(m=>Math.max(m.r,m.d)),0));
  const ticks=[0,.25,.5,.75,1].map(f=>f*mx);
  const bw=iw/months.length; const w=Math.min(22,bw*.32);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:500px;display:block" role="img" aria-label="Receitas e despesas por mês">`;
  ticks.forEach(v=>{const y=T+ih-v/mx*ih;s+=`<line class="grid-l" x1="${L}" x2="${W-12}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${compact(v)}</text>`;});
  months.forEach((m,i)=>{const cx=L+bw*i+bw/2;const hr=m.r/mx*ih,hd=m.d/mx*ih;
    s+=`<rect class="b-pos" x="${cx-w-2}" y="${T+ih-hr}" width="${w}" height="${Math.max(hr,0)}" rx="3"><title>Receitas ${fmt(m.r)}</title></rect><rect class="b-neg" x="${cx+2}" y="${T+ih-hd}" width="${w}" height="${Math.max(hd,0)}" rx="3"><title>Despesas ${fmt(m.d)}</title></rect><text x="${cx}" y="${H-8}" text-anchor="middle" ${m.ym===S.month?'style="fill:var(--fg);font-weight:600"':""}>${monthShort(m.ym)}</text>`;});
  return s+"</svg>";
}

function guessMethod(item){

let draft=null;
function openTx(t,opts={}){
  const isNew=!t;
  draft=t?{...t}:{kind:"despesa",amount:NaN,desc:"",date:S.month===todayStr().slice(0,7)?todayStr():S.month+"-01",categoryId:"",paid:true,repeat:"nao",n:2,note:"",method:opts.card?"c:"+opts.card:""};

}
function collectTx(){
  if(!document.getElementById("tx-amount")) return;
  draft.amount=parseMoney(val("tx-amount")); draft.desc=val("tx-desc"); draft.date=val("tx-date");
  draft.categoryId=val("tx-cat"); draft.method=val("tx-method")||draft.method; draft.to=val("tx-to");
  draft.paid=document.getElementById("tx-paid")?.checked??draft.paid; draft.repeat=val("tx-repeat")||"nao"; draft.n=+val("tx-n")||draft.n; draft.note=val("tx-note");
}
function renderTxForm(){
  const d=draft, k=d.kind, isCard=d.method?.startsWith("c:");
  const title=d._new?"Novo lançamento":(k==="pagfatura"?"Pagamento de fatura":"Editar lançamento");

async function saveTx(){
  collectTx(); const d=draft;
  if(!(d.amount>0)){toast("Informe um valor maior que zero.");return;}
  if(!d.date){toast("Informe a data.");return;}
  const k=d.kind;
  if(k!=="pagfatura"&&!d.method){toast("Cadastre uma conta antes de lançar.");return;}
  const desc=(d.desc||"").trim()||(k==="transf"?"Transferência":catOf(d.categoryId)?.name||(k==="receita"?"Receita":"Despesa"));
  const base={kind:k,desc,amount:d.amount,date:d.date,note:(d.note||"").trim()};
  if(k==="despesa"||k==="receita"){base.categoryId=d.categoryId||"";
    if(d.method.startsWith("c:")){base.cardId=d.method.slice(2);base.accountId=null;base.paid=true;}
    else {base.accountId=d.method.slice(2);base.cardId=null;base.paid=!!d.paid;}}
  if(k==="transf"){base.accountId=d.method.slice(2);base.toAccountId=(d.to||"").slice(2);base.paid=!!d.paid;
    if(!base.toAccountId||base.toAccountId===base.accountId){toast("Escolha contas diferentes de origem e destino.");return;}}
  if(!d._new){
    const upd={...base};
    if(k==="pagfatura"){delete upd.kind;}
    if(upd.cardId){const c=byId(S.cards,upd.cardId);if(c&&(!d.invoice||d.cardId!==upd.cardId||d.date!==upd.date)) upd.invoice=invoiceFor(c,upd.date);}
    const ok=await write(()=>col("tx").doc(d.id).update(upd),"Lançamento atualizado");
    if(ok) closeDlg(); return;
  }
  const card=base.cardId&&byId(S.cards,base.cardId);
  const n=d.repeat==="nao"?1:Math.max(2,Math.min(60,+d.n||2));
  const gid=n>1?"g"+Date.now().toString(36)+Math.random().toString(36).slice(2,6):null;
  const docs=[];
  const each=d.repeat==="parc"?Math.floor(d.amount/n*100)/100:d.amount;
  for(let i=0;i<n;i++){
    const date=addMonthsDate(d.date,i);
    const o={...base,date,...stamp(),source:"manual"};
    if(n>1){o.group=gid;o.seq=i+1;o.total=n;o.recur=d.repeat==="fixo";}
    if(d.repeat==="parc") o.amount=i===n-1?Math.round((d.amount-each*(n-1))*100)/100:each;
    if(card) o.invoice=d.repeat==="parc"?addYM(invoiceFor(card,d.date),i):invoiceFor(card,date);
    if(i>0&&!card) o.paid=false;
    docs.push(o);
  }
  const ok=await write(async()=>{for(const o of docs) await col("tx").doc().set(o);},n>1?`${n} lançamentos criados`:"Lançamento salvo");
  if(ok) closeDlg();
}
function askDelete(){
  const d=draft; const z=document.getElementById("del-zone");

  z.innerHTML=`<div class="banner" style="display:flex;flex-direction:column;gap:8px"><span>Excluir este lançamento? Não dá para desfazer.</span><div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn sm danger" data-act="tx-del-one">Excluir ${grp?"só esta":""}</button>${grp?`<button type="button" class="btn sm danger" data-act="tx-del-next">Esta e as próximas</button>`:""}<button type="button" class="btn sm" data-act="tx-del-cancel">Manter</button></div></div>`;

async function deleteTx(scope){
  const d=draft;

  if(ok) closeDlg();
}

document.addEventListener("submit",async e=>{

  if(["cfg-form","login-form","join-form","new-caixa-form"].includes(f.id)) return gateSubmit(f);
  if(f.id==="tx-form") return saveTx();

    const ok=await write(()=>f.dataset.id?col("accounts").doc(f.dataset.id).update(o):col("accounts").doc().set({...o,...stamp()}),"Conta salva"); if(ok) closeDlg();
  }
  if(f.id==="card-form"){
    const o={name:val("f-name").trim(),bank:val("f-bank"),final:val("f-final").replace(/\D/g,"").slice(0,4),limit:parseMoney(val("f-limit"))||0,closingDay:Math.min(31,Math.max(1,+val("f-close")||1)),dueDay:Math.min(31,Math.max(1,+val("f-due")||10)),payAccountId:val("f-payacc"),color:val("f-color"),archived:!!document.getElementById("f-arch")?.checked};
    if(!o.name) return toast("Dê um nome para o cartão.");
    const ok=await write(()=>f.dataset.id?col("cards").doc(f.dataset.id).update(o):col("cards").doc().set({...o,...stamp()}),"Cartão salvo"); if(ok){S.cardInv=null;closeDlg();}
  }
  if(f.id==="cat-form"){
    const o={name:val("f-name").trim(),color:val("f-color"),kind:f.dataset.kind};
    if(!o.name) return toast("Dê um nome para a categoria.");
    const ok=await write(()=>f.dataset.id?col("categories").doc(f.dataset.id).update(o):col("categories").doc().set({...o,...stamp()}),"Categoria salva"); if(ok) closeDlg();
  }
  if(f.id==="pay-form"){
    const amount=parseMoney(val("f-amount")); if(!(amount>0)) return toast("Informe o valor pago.");
    const card=byId(S.cards,f.dataset.id);
    const ok=await write(()=>col("tx").doc().set({kind:"pagfatura",desc:"Fatura "+card.name+" "+monthShort(f.dataset.inv),amount,date:val("f-date")||todayStr(),cardId:card.id,invoice:f.dataset.inv,accountId:val("f-acc"),paid:true,note:"",...stamp(),source:"manual"}),"Pagamento registrado"); if(ok) closeDlg();

    const id=f.dataset.id, diff=Math.round((real-accBalance(id))*100)/100;

  }
});

async function parseImport(){
  const text=val("imp-text"); const fb=val("imp-bank")||null;
  const items=splitNotifs(text).map(r=>parseNotif(r,fb)).filter(Boolean);
  if(!items.length) return toast("Não achei valores em R$ no texto. Confira se colou a notificação completa.");
  const ok=await write(async()=>{for(const it of items) await col("inbox").doc().set({...it,status:"pendente",...stamp()});},items.length===1?"1 notificação na caixa de entrada":items.length+" notificações na caixa de entrada");
  if(ok){const t=document.getElementById("imp-text");if(t)t.value="";}
}
function readInbox(id){
  const kind=val("ib-k-"+id), m=val("ib-m-"+id), amount=parseMoney(val("ib-v-"+id));
  if(!(amount>0)){toast("Valor inválido em uma notificação.");return null;}
  if(!m){toast("Cadastre uma conta antes de lançar.");return null;}
  const date=val("ib-dt-"+id)||todayStr();
  const o={kind,desc:val("ib-d-"+id).trim()||"Lançamento",amount,date,categoryId:val("ib-c-"+id),note:"",source:"notificacao",...stamp()};
  if(m.startsWith("c:")&&kind==="despesa"){const c=byId(S.cards,m.slice(2));o.cardId=c.id;o.accountId=null;o.paid=true;o.invoice=invoiceFor(c,date);}
  else {o.accountId=m.slice(2);o.cardId=null;o.paid=true;}
  return o;
}
async function inboxOk(ids){
  const pairs=ids.map(id=>[id,readInbox(id)]); if(pairs.some(p=>!p[1])) return;
  await write(async()=>{for(const [id,o] of pairs){await col("tx").doc().set(o);await col("inbox").doc(id).delete();}},pairs.length===1?"Lançado":pairs.length+" lançamentos criados");
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==="toggle-paid"||a==="edit-card"){e.stopPropagation();}
  switch(a){
    case "go": closeDlg(); go(el.dataset.v); break;
    case "more": openMore(); break;
    case "close": closeDlg(); break;
    case "m-prev": S.month=addYM(S.month,-1); renderAll(); break;
    case "m-next": S.month=addYM(S.month,1); renderAll(); break;
    case "new-tx": if(!canW()) return toast("Você está só visualizando."); openTx(null,{card:el.dataset.card}); break;
    case "edit-tx": {const t=byId(S.tx,id); if(t) openTx(t);} break;
    case "toggle-paid": {const t=byId(S.tx,id); if(t) write(()=>col("tx").doc(id).update({paid:!t.paid}),t.paid?"Marcado como pendente":(t.kind==="receita"?"Marcado como recebido":"Marcado como pago"));} break;
    case "tx-kind": collectTx(); draft.kind=el.dataset.v; draft.categoryId=""; if(draft.kind!=="despesa"&&draft.method?.startsWith("c:")){const ac=S.accounts.find(x=>!x.archived);draft.method=ac?"a:"+ac.id:"";} if(draft.kind!=="despesa"&&draft.repeat==="parc")draft.repeat="nao"; renderTxForm(); break;
    case "tx-del": askDelete(); break;
    case "tx-del-cancel": document.getElementById("del-zone").innerHTML=""; break;
    case "tx-del-one": deleteTx("one"); break;
    case "tx-del-next": deleteTx("next"); break;
    case "f-kind": S.filter.kind=el.dataset.v; renderAll(); break;
    case "new-acc": openAcc(null); break;
    case "edit-acc": {const x=byId(S.accounts,id); if(x) openAcc(x);} break;
    case "new-card": openCard(null); break;
    case "edit-card": {const x=byId(S.cards,id); if(x) openCard(x);} break;
    case "open-card": S.cardSel=id; S.cardInv=null; go("cartoes"); break;
    case "sel-card": S.cardSel=id; S.cardInv=null; renderAll(); break;
    case "inv-prev": S.cardInv=addYM(S.cardInv,-1); renderAll(); break;
    case "inv-next": S.cardInv=addYM(S.cardInv,1); renderAll(); break;
    case "pay-inv": {const c=byId(S.cards,id); if(c) openPayInv(c);} break;
    case "transfer": e.stopPropagation(); openTx(null); collectTx(); draft.kind="transf"; draft.method="a:"+id; renderTxForm(); break;
    case "adjust": e.stopPropagation(); {const x=byId(S.accounts,id); if(x) openAdjust(x);} break;
    case "new-cat": openCat(null,el.dataset.kind); break;
    case "edit-cat": {const x=byId(S.cats,id); if(x) openCat(x);} break;
    case "swatch": el.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===el)); document.getElementById("f-color").value=el.dataset.v; break;
    case "acc-del": case "card-del": case "cat-del": {
      const kindN={"acc-del":"accounts","card-del":"cards","cat-del":"categories"}[a];
      const used=a==="cat-del"?S.tx.filter(t=>t.categoryId===id).length:S.tx.filter(t=>t.accountId===id||t.toAccountId===id||t.cardId===id).length;
      document.getElementById("del-zone").innerHTML=`<div class="banner" style="display:flex;flex-direction:column;gap:8px"><span>${used?`Há ${used} lançamento${used===1?"":"s"} ligado${used===1?"":"s"} a este item. Eles continuam, mas ficam sem ${a==="cat-del"?"categoria":"conta"}.${a!=="cat-del"?" Se quiser só esconder, use Arquivar.":""}`:"Excluir de vez?"}</span><div style="display:flex;gap:6px"><button type="button" class="btn sm danger" data-act="really-del" data-col="${kindN}" data-id="${id}">Excluir</button><button type="button" class="btn sm" data-act="tx-del-cancel">Manter</button></div></div>`;
    } break;
    case "really-del": write(()=>col(el.dataset.col).doc(id).delete(),"Excluído").then(ok=>ok&&closeDlg()); break;
    case "parse": parseImport(); break;
    case "inbox-ok": inboxOk([id]); break;
    case "inbox-all": inboxOk(S.inbox.filter(i=>i.status!=="ignorado").map(i=>i.id)); break;
    case "login-mode": S.loginMode=S.loginMode==="up"?"in":"up"; renderAll(); break;
    case "pick-caixa": {const c=(S.myCaixas||[]).find(x=>x.id===id); if(c) openCaixa(c);} break;
    case "logout": lsSet("cc_caixa",null); androidCall("clearDevice"); sb&&sb.auth.signOut(); break;
    case "switch-caixa": lsSet("cc_caixa",null); S.caixa=null; S.db=null; S.gate="caixa"; if(channel) sb.removeChannel(channel); afterLogin(S.session); break;
    case "copy-code": {const t=S.caixa.codigo; navigator.clipboard?.writeText(t).then(()=>toast("Código copiado"),()=>toast("Código: "+t));} break;
    case "android-settings": androidCall("openNotifSettings"); break;
    case "android-link": connectAndroid(true); break;
    case "android-flush": androidCall("flush"); setTimeout(refreshAndroid,2500); toast("Enviando a fila…"); break;
    case "disp-del": write(async()=>{const {error}=await sb.from("dispositivos").delete().eq("token",id); if(error) throw error; await loadMembers();},"Celular desconectado"); break;
    case "inbox-drop": write(()=>col("inbox").doc(id).delete(),"Descartada"); break;
  }
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click();}});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.change==="f-src"){S.filter.src=el.value;renderAll();}
  if(el.dataset.actChange==="tx-method"||el.dataset.actChange==="tx-repeat"||el.id==="tx-date"){collectTx();renderTxForm();}
  if(el.dataset.change==="budget"){
    const v=el.value.trim()?parseMoney(el.value):0; if(isNaN(v)) return toast("Valor inválido.");
    const limits={...S.budget}; if(v>0) limits[el.dataset.id]=v; else delete limits[el.dataset.id];
    if(JSON.stringify(limits)===JSON.stringify(S.budget)) return;
    write(()=>DBDOC("budgets/padrao").set({limits}),"Limite salvo");
  }
  if(el.id&&el.id.startsWith("ib-k-")){const id=el.id.slice(5);const it0=byId(S.inbox,id);if(it0){const it=inboxView(it0);const m=document.getElementById("ib-m-"+id),c=document.getElementById("ib-c-"+id);const k=el.value;m.innerHTML=methodOptions(guessMethod({...it,card:k==="despesa"&&it.card}),k);c.innerHTML=catOptions(guessCat(it.desc||"",k),k);}}
});
document.addEventListener("input",e=>{
  if(e.target.dataset.input==="f-q"){S.filter.q=e.target.value;clearTimeout(S._qt);S._qt=setTimeout(renderAll,180);}
});
boot();
if("serviceWorker" in navigator){}
</script>
</body>
</html>
