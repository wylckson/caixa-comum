name: Gerar APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Montar o APK
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          URL="https://${OWNER,,}.github.io/${REPO}/"
          echo "Site usado pelo app: $URL"
          gradle -p android assembleRelease -PwebUrl="$URL" -PversionCode=${{ github.run_number }}
          cp android/app/build/outputs/apk/release/app-release.apk CaixaComum.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CaixaComum-apk
          path: CaixaComum.apk

      - name: Publicar em Releases (para baixar no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Caixa Comum versão ${{ github.run_number }}
          body: Baixe o arquivo CaixaComum.apk abaixo, no celular Android, e instale.
          files: CaixaComum.apk
